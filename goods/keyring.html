<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>키링 | 봉다 굿즈</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="goods-detail.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="logo" href="../졸업연구 플로빙 작업.html"><img src="../bongda-logo.png" alt="봉다" /></a>
      <nav class="nav__links"><a href="../졸업연구 플로빙 작업.html#goods">굿즈</a></nav>
    </div>
  </header>
  <main class="product">
    <nav class="breadcrumb"><a href="../졸업연구 플로빙 작업.html#goods">굿즈 라인업</a> / <span>키링</span></nav>
    <div class="product__layout">
      <div class="product__visual" aria-hidden="true"><p class="product__visual-label">키링</p></div>
      <div>
        <p class="product__kicker">해안 굿즈</p>
        <h1 class="product__title">키링</h1>
        <p class="product__price">12,000원</p>
        <p class="product__desc">봉다 워드마크와 해양 모티브 아크릴 키링입니다.</p>
        <div class="option-block" data-option-group>
          <p class="option-block__label">디자인 <span class="option-block__hint" data-option-hint>선택: 파도</span></p>
          <div class="option-grid">
            <button type="button" class="option-btn is-selected" data-label="파도">파도</button>
            <button type="button" class="option-btn" data-label="해녀">해녀</button>
            <button type="button" class="option-btn" data-label="로고">로고</button>
          </div>
        </div>
        <div class="product__actions">
          <button type="button" class="btn btn--primary">장바구니 담기</button>
          <a class="btn btn--ghost" href="../졸업연구 플로빙 작업.html">홈으로</a>
        </div>
        <section class="specs">
          <h2>상품 정보</h2>
          <dl>
            <div class="specs__row"><dt>크기</dt><dd>약 45 × 45mm</dd></div>
            <div class="specs__row"><dt>구성</dt><dd>키링 1 · O링 1</dd></div>
          </dl>
        </section>
      </div>
    </div>
  </main>
  <script src="goods-detail.js"></script>
</body>
</html>
