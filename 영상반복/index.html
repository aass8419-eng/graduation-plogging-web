<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영상 반복</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
    }

    video.is-on { opacity: 1; }

    .error {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #000;
      color: #f4f4f2;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <video id="v0" playsinline preload="auto"></video>
    <video id="v1" playsinline preload="auto"></video>
    <div class="error" id="error" hidden>
      <p>영상을 불러오지 못했습니다. 이 페이지와 영상 파일이 같은 폴더에 있는지 확인해 주세요.</p>
    </div>
  </div>

  <script>
    const sources = [
      "0917 포스터.mp4",
      "0923 라운드.mp4",
      "0923 -2.mp4",
      "마지막1012.mp4",
      "첫번째 플로빙 1012.mp4",
      "1012-1 플로빙.mp4",
      "모델4.mp4",
      "0911 4명.mp4"
    ];

    const players = [document.getElementById("v0"), document.getElementById("v1")];
    const errorEl = document.getElementById("error");

    let active = 0;
    let lastName = "";
    let failStreak = 0;
    let soundOn = true;
    let waitingForGesture = false;

    function pickRandom(except) {
      const pool = sources.filter((name) => name !== except);
      const choice = pool[Math.floor(Math.random() * pool.length)];
      lastName = choice;
      return choice;
    }

    function loadInto(video, name) {
      video.dataset.name = name;
      video.src = new URL(name, document.baseURI).href;
      video.load();
    }

    function armStandby() {
      loadInto(players[1 - active], pickRandom(players[active].dataset.name || lastName));
    }

    function reveal(video) {
      players.forEach((item) => item.classList.toggle("is-on", item === video));
    }

    function unlockSound() {
      waitingForGesture = false;
      soundOn = true;
      const current = players[active];
      current.muted = false;
      current.volume = 1;
      const pending = current.play();
      if (pending) pending.catch(() => {});
    }

    function playCurrent() {
      const current = players[active];
      const other = players[1 - active];
      current.muted = !soundOn;
      current.volume = 1;
      other.pause();
      reveal(current);
      const pending = current.play();
      if (!pending) return;
      pending.then(() => {
        failStreak = 0;
      }).catch(() => {
        if (soundOn) {
          soundOn = false;
          current.muted = true;
          const mutedPlay = current.play();
          if (mutedPlay) mutedPlay.catch(() => {});
        }
        if (waitingForGesture) return;
        waitingForGesture = true;
        const resume = () => {
          document.removeEventListener("pointerdown", resume);
          document.removeEventListener("keydown", resume);
          unlockSound();
        };
        document.addEventListener("pointerdown", resume, { once: false });
        document.addEventListener("keydown", resume);
      });
    }

    function advance() {
      active = 1 - active;
      playCurrent();
      armStandby();
    }

    function onEnded(event) {
      if (event.target !== players[active]) return;
      advance();
    }

    function onError(event) {
      if (event.target !== players[active]) return;
      failStreak += 1;
      if (failStreak > sources.length) {
        errorEl.hidden = false;
        return;
      }
      advance();
    }

    players.forEach((video) => {
      video.addEventListener("ended", onEnded);
      video.addEventListener("error", onError);
    });

    loadInto(players[0], pickRandom(""));
    loadInto(players[1], pickRandom(players[0].dataset.name));
    playCurrent();
  </script>
</body>
</html>
